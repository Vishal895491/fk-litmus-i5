
name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows
        run: |
          if (!(Test-Path windows)) {
            flutter create --platforms=windows .
          }
        shell: pwsh

      - name: Install dependencies
        run: flutter pub get

      - name: Build EXE
        run: flutter build windows --release

      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "fk-litmus-i5-portable.zip"
        shell: pwsh

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fk-litmus-i5-Windows-Portable
          path: fk-litmus-i5-portable.zip
